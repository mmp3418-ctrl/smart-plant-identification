<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="نبْتة — نظام ذكي لتعريف النباتات وتقييم ملاءمتها البيئية. مشروع تخرج جامعي."
    />
    <meta name="theme-color" content="#286B45" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>نبْتة | تعريف النباتات والملاءمة البيئية</title>
    <script>
      (function () {
        try {
          /* Default is always light; dark only when user explicitly chose it */
          var stored = localStorage.getItem('spi.theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}

        /* If opened via a non-hash deep link on GH Pages, prefer hash routing */
        try {
          var base = '/smart-plant-identification';
          var path = location.pathname || '';
          var hash = location.hash || '';
          if (
            path.indexOf(base) === 0 &&
            path !== base &&
            path !== base + '/' &&
            (!hash || hash === '#')
          ) {
            var relative = path.slice(base.length) || '/';
            if (relative.charAt(0) !== '/') relative = '/' + relative;
            location.replace(base + '/#' + relative + (location.search || ''));
          }
        } catch (e2) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
